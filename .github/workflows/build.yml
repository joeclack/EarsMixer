name: build-and-package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check minified assets are up to date
        run: |
          npm run build
          git diff --exit-code -- web/mixer.min.js web/mixer.min.css \
            || (echo "::error::web/mixer.min.* is stale - run 'npm run build' and commit the result" && exit 1)

      - name: Build executables
        run: npm run package

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-binaries
          path: dist/

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-plugins
          path: plugins/

  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use HTTPS for the public OSC dependency
        # The lockfile uses a Git SSH URL; no SSH key is needed for this public repo.
        run: |
          git config --global --add 'url.https://github.com/.insteadOf' 'ssh://git@github.com/'
          git config --global --add 'url.https://github.com/.insteadOf' 'git@github.com:'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        # Inno Setup and the .NET Framework compiler are included in windows-2025.
        # Product metadata comes from installer/version.inc.iss.
        run: npm run installer:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
