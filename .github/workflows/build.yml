name: build-and-package

on:
  workflow_dispatch:
    inputs:
      test_installer:
        description: 'Run full Windows installation and upgrade tests'
        type: boolean
        required: false
        default: false
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check minified assets are up to date
        run: |
          npm run build
          git diff --exit-code -- web/mixer.min.js web/mixer.min.css \
            || (echo "::error::web/mixer.min.* is stale - run 'npm run build' and commit the result" && exit 1)

      - name: Build executables
        run: npm run package

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-binaries
          path: dist/

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-plugins
          path: plugins/

  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use HTTPS for the public OSC dependency
        # The lockfile uses a Git SSH URL; no SSH key is needed for this public repo.
        run: |
          git config --global --add 'url.https://github.com/.insteadOf' 'ssh://git@github.com/'
          git config --global --add 'url.https://github.com/.insteadOf' 'git@github.com:'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        # Inno Setup and the .NET Framework compiler are included in windows-2025.
        # Product metadata comes from installer/version.inc.iss.
        run: npm run installer:windows

      - name: Test Windows installer upgrades
        if: github.event_name == 'workflow_dispatch' && inputs.test_installer
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/*-windows-x64-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer to test.' }
          ./tools/test-installer-upgrade.ps1 -Installer $installer[0].FullName

      - name: Upload installer test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-installer-test-logs
          path: dist/installer-smoke/*.log
          if-no-files-found: ignore

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos-app:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use HTTPS for the public OSC dependency
        run: |
          git config --global --add 'url.https://github.com/.insteadOf' 'ssh://git@github.com/'
          git config --global --add 'url.https://github.com/.insteadOf' 'git@github.com:'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run installer:macos

      - name: Check the server starts
        run: |
          home=$(mktemp -d)
          OSC_WEBMIXER_HOME="$home" OSC_WEBMIXER_WEB_PORT=8765 dist/macos/EarsMixer.app/Contents/Resources/server/earsmixer-arm64 > "$home/out.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/connection > /dev/null; then kill $pid; echo "Server answered"; exit 0; fi
            sleep 1
          done
          cat "$home/out.log"; kill $pid || true; exit 1

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: EarsMixer-macos-app
          path: dist/*-macos.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish Windows release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, windows-installer, macos-app]
    runs-on: windows-2025
    permissions:
      contents: write
    concurrency:
      group: earsmixer-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: EarsMixer-windows-installer
          path: dist

      - name: Download macOS app
        uses: actions/download-artifact@v4
        with:
          name: EarsMixer-macos-app
          path: dist

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-windows-release.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA
