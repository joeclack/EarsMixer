services:
  webmixer:
    build: .
    image: oscwebmixer2:latest
    init: true
    entrypoint: ["node", "tools/dev.cjs"]
    ports:
      - "8082:8080/tcp"
    environment:
      OSC_WEBMIXER_DEV_WEB_PORT: "8080"
      OSC_WEBMIXER_DEV_OSC_PORT: "8012"
      OSC_WEBMIXER_DEV_DESK_PORT: "9012"
      OSC_WEBMIXER_DEV_BIND_ADDRESS: "0.0.0.0"
      OSC_WEBMIXER_DEV_CONFIG_DIR: "/webmixer/config/demo"
      OSC_WEBMIXER_DATA_DIR: "/webmixer/config/demo/data"
      OSC_WEBMIXER_PUBLIC_URL: "http://localhost:8082"
    volumes:
      - ./config:/webmixer/config
